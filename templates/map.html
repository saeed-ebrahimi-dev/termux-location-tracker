<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: #1a1a2e;
            color: #fff;
        }
        #batteryBar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: linear-gradient(135deg, #16213e, #0f3460);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
            gap: 8px;
        }
        .battery-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .battery-icon {
            width: 44px;
            height: 24px;
            border: 2px solid #fff;
            border-radius: 4px;
            position: relative;
            display: flex;
            align-items: center;
            padding: 2px;
        }
        .battery-icon::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 6px;
            width: 4px;
            height: 8px;
            background: #fff;
            border-radius: 0 2px 2px 0;
        }
        .battery-fill {
            height: 100%;
            border-radius: 2px;
            background: #4caf50;
            transition: width 0.5s ease, background 0.5s ease;
            min-width: 2px;
        }
        .battery-fill.low {
            background: #f44336;
        }
        .battery-fill.medium {
            background: #ff9800;
        }
        #batteryPercent {
            font-size: 20px;
            font-weight: bold;
        }
        #batteryStatus {
            font-size: 13px;
            color: #aaa;
        }
        #lastUpdate {
            font-size: 12px;
            color: #8ab4f8;
        }
        #map {
            height: 100vh;
            width: 100%;
            z-index: 1;
        }
        #infoCard {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(22, 33, 62, 0.95);
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            max-width: 320px;
            font-size: 14px;
            line-height: 1.8;
        }
        #infoCard h3 {
            margin-bottom: 8px;
            color: #8ab4f8;
            font-size: 16px;
        }
        #infoCard .row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        #infoCard .label {
            color: #aaa;
        }
        #infoCard .value {
            font-weight: 600;
            color: #fff;
            direction: ltr;
        }
        #googleMapsBtn {
            display: inline-block;
            margin-top: 12px;
            background: #4285F4;
            color: #fff;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.3s;
            width: 100%;
            text-align: center;
        }
        #googleMapsBtn:hover {
            background: #3367d6;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }
        .gmap-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: #4285F4;
            color: #fff;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.3s, transform 0.15s;
            border: none;
            cursor: pointer;
        }
        .gmap-btn:hover {
            background: #3367d6;
        }
        .gmap-btn:active {
            transform: scale(0.98);
        }
        .gmap-btn.secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .gmap-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        #statusOverlay {
            position: fixed;
            top: 60px;
            right: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: #ffd54f;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            border: 1px solid rgba(255, 213, 79, 0.4);
        }
        .attr {
            font-size: 12px;
            color: #aaa;
            margin-top: 4px;
        }
        /* ===== Tablet ===== */
        @media (max-width: 900px) {
            #infoCard {
                width: 260px;
                bottom: 12px;
                left: 12px;
                padding: 12px 14px;
                border-radius: 12px;
            }
            #infoCard h3 { font-size: 14px; }
            .info-row .label { font-size: 11px; }
            .info-row .value { font-size: 12px; }
            .gmap-btn { padding: 10px 14px; font-size: 13px; }
            #batteryBar { padding: 8px 14px; }
        }

        /* ===== Mobile ===== */
        @media (max-width: 600px) {
            #batteryBar {
                padding: 8px 12px;
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
                min-height: auto;
            }
            .battery-section {
                justify-content: space-between;
                width: 100%;
            }
            #batteryPercent { font-size: 17px; }
            #batteryStatus { max-width: 160px; font-size: 11px; }
            #lastUpdate { font-size: 11px; }
            #statusOverlay {
                top: auto;
                bottom: 12px;
                right: 12px;
                left: 12px;
                text-align: center;
            }
            #infoCard {
                inset: auto 8px 8px 8px;
                width: auto;
                max-width: none;
                max-height: 45vh;
                border-radius: 14px;
                padding: 12px 14px;
                padding-bottom: calc(12px + env(safe-area-inset-bottom));
                box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.5);
                overflow-y: auto;
            }
            .info-row .label { font-size: 11px; }
            .info-row .value { font-size: 12px; }
            .gmap-btn { padding: 12px; font-size: 13px; border-radius: 10px; }
        }

        /* Very small mobile */
        @media (max-width: 380px) {
            .info-row { flex-direction: column; align-items: flex-start; gap: 2px; }
            .info-row .value { width: 100%; }
        }

        /* ===== Safe area for iPhone ===== */
        @supports (padding: max(0px)) {
            #batteryBar {
                padding-top: max(10px, env(safe-area-inset-top));
            }
        }

        /* ===== Tracker Target Icon (blue dot with pulse rings) ===== */
        .tracker-target {
            position: relative;
            width: 44px;
            height: 44px;
        }
        .tt-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 44px;
            height: 44px;
            border: 2px solid #4285F4;
            border-radius: 50%;
            opacity: 0.6;
            animation: tt-pulse 2s ease-out infinite;
        }
        .tt-ring:nth-child(2) {
            animation-delay: 0.7s;
        }
        .tt-ring:nth-child(3) {
            animation-delay: 1.4s;
        }
        .tt-dot {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 14px;
            height: 14px;
            background: #4285F4;
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(66, 133, 244, 0.6);
        }
        @keyframes tt-pulse {
            0% { transform: scale(0.4); opacity: 0.8; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        .tracker-target-icon {
            background: transparent;
            border: none;
        }
        /* ===== Mobile Collapsible Menu (FAB button) ===== */
        #menuFab {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 1002;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #4285F4;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }
        @media (max-width: 600px) {
            #menuFab {
                display: block;
            }
            #infoCard {
                display: none;
                inset: auto 8px 80px 8px !important;
                max-height: 55vh;
            }
            #infoCard.open {
                display: block;
            }
        }
        /* ===== Popup style ===== */
        .leaflet-popup-content-wrapper {
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <!-- Top bar: battery -->
    <div id="batteryBar">
        <div class="battery-section">
            <div class="battery-icon">
                <div class="battery-fill" id="batteryFill" style="width: 0%;"></div>
            </div>
            <div>
                <span id="batteryPercent">--%</span>
                <div id="batteryStatus">Waiting for data...</div>
            </div>
        </div>
        <div class="battery-section">
            <span id="lastUpdate">Last device update: --</span>
        </div>
    </div>

    <!-- Map -->
    <div id="map"></div>

    <!-- Info card -->
    <div id="infoCard">
        <h3>📡 Location Coordinates</h3>
        <div class="row"><span class="label">Latitude:</span><span class="value" id="latVal">--</span></div>
        <div class="row"><span class="label">Longitude:</span><span class="value" id="lonVal">--</span></div>
        <div class="row"><span class="label">Altitude:</span><span class="value" id="altVal">--</span></div>
        <div class="row"><span class="label">Accuracy:</span><span class="value" id="accVal">--</span></div>
        <div class="row"><span class="label">Speed:</span><span class="value" id="spdVal">--</span></div>
        <div class="row"><span class="label">Bearing:</span><span class="value" id="brgVal">--</span></div>
        <div class="row"><span class="label">Provider:</span><span class="value" id="provVal">--</span></div>
        <div class="button-group">
            <a id="googleMapsBtn" class="gmap-btn" href="#" target="_blank" rel="noopener">🧭 Navigate in Google Maps</a>
            <a id="googleMapsViewBtn" class="gmap-btn secondary" href="#" target="_blank" rel="noopener">📍 View on Google Maps</a>
        </div>
    </div>

    <div id="statusOverlay">🟢 Live updates active</div>

    <!-- Mobile FAB button to toggle info card -->
    <button id="menuFab" title="Coordinates">📍</button>

    <script>
        // ---------- Mobile menu toggle ----------
        document.getElementById('menuFab').addEventListener('click', function() {
            const card = document.getElementById('infoCard');
            card.classList.toggle('open');
            this.textContent = card.classList.contains('open') ? '✕' : '📍';
        });

        // ---------- Map ----------
        const map = L.map('map', { zoomControl: true }).setView([32.0, 53.0], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Tracker-style target icon (blue dot with pulse rings)
        const targetIcon = L.divIcon({
            className: 'tracker-target-icon',
            html: '<div class="tracker-target"><div class="tt-ring"></div><div class="tt-ring"></div><div class="tt-ring"></div><div class="tt-dot"></div></div>',
            iconSize: [44, 44],
            iconAnchor: [22, 22]
        });

        let targetMarker = null;
        let accuracyCircle = null;
        let pathTrail = [];
        let trailPolyline = null;

        function updateMap(data) {
            const lat = data.location.latitude;
            const lon = data.location.longitude;

            // Target marker
            if (!targetMarker) {
                targetMarker = L.marker([lat, lon], { icon: targetIcon }).addTo(map);
                targetMarker.bindPopup('<b>🎯 Target Location</b><br>' + lat.toFixed(6) + ', ' + lon.toFixed(6));
            } else {
                targetMarker.setLatLng([lat, lon]);
                targetMarker.setPopupContent('<b>🎯 Target Location</b><br>' + lat.toFixed(6) + ', ' + lon.toFixed(6));
            }

            // Accuracy circle
            const accuracy = data.location.accuracy || 0;
            if (accuracyCircle) {
                map.removeLayer(accuracyCircle);
            }
            accuracyCircle = L.circle([lat, lon], {
                radius: accuracy,
                color: '#4285F4',
                fillColor: '#4285F4',
                fillOpacity: 0.15,
                weight: 1
            }).addTo(map);

            // Movement trail (last 100 points) - dashed line
            pathTrail.push([lat, lon]);
            if (pathTrail.length > 100) pathTrail.shift();

            if (!trailPolyline) {
                trailPolyline = L.polyline(pathTrail, {
                    color: '#ff6b6b',
                    weight: 3,
                    opacity: 0.8,
                    dashArray: '6, 8',
                    lineJoin: 'round'
                }).addTo(map);
            } else {
                // Update existing polyline
                trailPolyline.setLatLngs(pathTrail);
            }

            // Zoom to target if we have accuracy
            if (accuracy > 0) {
                map.fitBounds(accuracyCircle.getBounds(), { maxZoom: 17 });
            } else {
                map.setView([lat, lon], 16);
            }

            // ---------- Update info card ----------
            document.getElementById('latVal').textContent = lat.toFixed(6);
            document.getElementById('lonVal').textContent = lon.toFixed(6);
            document.getElementById('altVal').textContent = (data.location.altitude != null ? data.location.altitude.toFixed(1) + ' m' : '--');
            document.getElementById('accVal').textContent = (data.location.accuracy != null ? data.location.accuracy.toFixed(1) + ' m' : '--');
            document.getElementById('spdVal').textContent = (data.location.speed != null ? data.location.speed.toFixed(2) + ' m/s' : '--');
            document.getElementById('brgVal').textContent = (data.location.bearing != null ? data.location.bearing.toFixed(1) + '°' : '--');
            document.getElementById('provVal').textContent = data.location.provider || '--';

            // ---------- Google Maps links ----------
            const coordStr = lat.toFixed(6) + ',' + lon.toFixed(6);
            const encodedCoord = encodeURIComponent(coordStr);

            // Directions link
            const gmapsDirUrl = 'https://www.google.com/maps/dir/?api=1&destination=' + encodedCoord + '&travelmode=driving';
            document.getElementById('googleMapsBtn').href = gmapsDirUrl;

            // Direct view
            const gmapsViewUrl = 'https://www.google.com/maps?q=' + encodedCoord + '&z=16';
            const viewBtn = document.getElementById('googleMapsViewBtn');
            if (viewBtn) {
                viewBtn.href = gmapsViewUrl;
            }

            // ---------- Update battery ----------
            if (data.battry) {
                const percent = data.battry.percentage != null ? data.battry.percentage : (data.battry.level != null ? data.battry.level : null);
                const fill = document.getElementById('batteryFill');
                const pctEl = document.getElementById('batteryPercent');

                if (percent != null) {
                    pctEl.textContent = percent + '%';
                    fill.style.width = percent + '%';
                    fill.classList.toggle('low', percent < 20);
                    fill.classList.toggle('medium', percent >= 20 && percent < 50);
                }

                let statusText = data.battry.status || '';
                if (data.battry.plugged && data.battry.plugged !== 'UNPLUGGED') {
                    statusText = '⚡ Charging';
                } else if (statusText === 'DISCHARGING') {
                    statusText = '🔋 Discharging';
                } else if (statusText === 'FULL') {
                    statusText = '✅ Full';
                }
                statusText += ' | ' + (data.battry.temperature != null ? data.battry.temperature.toFixed(1) + '°C' : '');
                document.getElementById('batteryStatus').textContent = statusText;
            }

            // ---------- Last update time ----------
            if (data.received_at_display) {
                document.getElementById('lastUpdate').textContent = 'Last device data: ' + data.received_at_display;
            } else {
                const now = new Date();
                const nowStr = now.toLocaleDateString('en-GB') + ' ' + now.toLocaleTimeString('en-GB');
                document.getElementById('lastUpdate').textContent = 'Last device data: ' + nowStr;
            }
        }

        function showStatus(msg, show = true) {
            const el = document.getElementById('statusOverlay');
            el.textContent = msg;
            el.style.display = show ? 'block' : 'none';
            if (show) {
                setTimeout(() => { el.style.display = 'none'; }, 3000);
            }
        }

        // ---------- Polling to fetch data ----------
        let pollTimer = null;
        let lastDataHash = '';
        let isFirstLoad = true;

        async function fetchLatest() {
            try {
                const res = await fetch('/api/location');
                const json = await res.json();
                if (json.location) {
                    const hash = JSON.stringify(json);
                    if (hash !== lastDataHash || isFirstLoad) {
                        lastDataHash = hash;
                        isFirstLoad = false;
                        const data = {
                            location: json.location,
                            battry: json.battry,
                            received_at_display: json.received_at_display
                        };
                        updateMap(data);
                        showStatus('🟢 New data received');
                    }
                } else {
                    // No data from device yet
                    document.getElementById('statusOverlay').textContent = '⏳ Waiting for data from device...';
                    document.getElementById('statusOverlay').style.display = 'block';
                }
            } catch (e) {
                console.error('Error fetching data:', e);
                showStatus('🔴 Connection error', true);
            }
        }

        // Poll the server every 2 seconds
        function startPolling() {
            fetchLatest();
            pollTimer = setInterval(fetchLatest, 2000);
        }

        // Startup
        startPolling();
    </script>
</body>
</html>
